<section class="bg-gray-800 text-white py-16 md:py-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <h2 class="text-3xl md:text-4xl font-bold mb-8">{{ block.title }}</h2>

        {% if block.social_links %}
            <div class="flex flex-wrap justify-center gap-3 mb-8">
                {% for link in block.social_links %}
                    <a href="{{ link.value.url }}" target="_blank" rel="noopener"
                       class="px-4 py-2 border border-gray-600 rounded-full text-sm hover:bg-white hover:text-gray-900 transition-colors">
                        {{ link.value.name }}
                    </a>
                {% endfor %}
            </div>
        {% endif %}

        {% if block.discord_url %}
            <a href="{{ block.discord_url }}" target="_blank" rel="noopener"
               class="inline-block px-8 py-3 bg-indigo-600 text-white font-semibold rounded-full hover:bg-indigo-500 transition-colors">
                Rejoindre le Discord
            </a>
        {% endif %}
    </div>
</section>
