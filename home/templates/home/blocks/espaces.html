<section class="py-16 md:py-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl md:text-4xl font-bold text-center mb-2">{{ block.title }}</h2>
        {% if block.subtitle %}
            <p class="text-gray-500 text-center mb-12">{{ block.subtitle }}</p>
        {% endif %}
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for monde_item in block.mondes %}
                {% with monde=monde_item.value %}
                    {% include "includes/monde_card.html" %}
                {% endwith %}
            {% endfor %}
        </div>
    </div>
</section>
