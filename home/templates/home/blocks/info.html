<section class="py-16 md:py-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl md:text-4xl font-bold text-center mb-12">{{ block.title }}</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 max-w-4xl mx-auto">
            {% if block.access %}
                <div>
                    <h3 class="text-xl font-semibold mb-4">Accès</h3>
                    <div class="text-gray-600 prose">{{ block.access|safe }}</div>
                </div>
            {% endif %}
            {% if block.schedule %}
                <div>
                    <h3 class="text-xl font-semibold mb-4">Horaires</h3>
                    <div class="text-gray-600 prose">{{ block.schedule|safe }}</div>
                </div>
            {% endif %}
        </div>
    </div>
</section>
