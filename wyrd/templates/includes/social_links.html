<div class="flex flex-wrap gap-3">
    {% for link in social_links %}
        <a href="{{ link.value.url }}" target="_blank" rel="noopener"
           class="text-gray-400 hover:text-white transition-colors text-sm px-3 py-1 border border-gray-700 rounded-full">
            {{ link.value.name }}
        </a>
    {% endfor %}
</div>
