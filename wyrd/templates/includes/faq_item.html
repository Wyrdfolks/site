{% load wagtailcore_tags %}

{# wyrd/templates/includes/faq_item.html #}
{# Single FAQ item partial for reuse #}
<div 
    data-faq-item
    class="bg-white rounded-lg shadow-sm text-left"
>
    <button 
        data-faq-trigger
        type="button"
        id="{{ faq_id }}-trigger"
        aria-expanded="false"
        aria-controls="{{ faq_id }}-answer"
        class="min-h-13 w-full flex items-start justify-between cursor-pointer pl-6 pr-2 py-2 font-bold text-wyrd-indigo-900 text-left"
    >
        <span class="self-center">{{ item.question }}</span>
        <span class="bg-wyrd-pink-100 rounded-lg h-9 w-9 flex items-center justify-center shrink-0">
            <svg 
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                stroke="black"
                xmlns="http://www.w3.org/2000/svg"
                class="transition-transform duration-300 ease-out"
                data-faq-icon
            >
                <line x1="8.5" y1="1" x2="8.5" y2="14" />
                <line x1="2" y1="7.5" x2="15" y2="7.5" />
            </svg>
        </span>
    </button>
    
    <div
        id="{{ faq_id }}-answer"
        data-faq-answer
        role="region"
        aria-labelledby="{{ faq_id }}-trigger"
        aria-hidden="true"
        hidden
        class="h-0 overflow-hidden transition-all duration-300 ease-out"
    >
        <div 
            data-faq-answer-inner
            class="px-6 md:pb-6 pb-4 md:pt-6 pt-2 prose font-medium text-wyrd-indigo-500 opacity-0 translate-y-2 transition duration-200 ease-in flex flex-col gap-2"
        >
            {{ item.answer|richtext }}
        </div>
    </div>
</div>
