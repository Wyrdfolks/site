{% load wagtailimages_tags %}

<div class="card bg-white rounded-4xl overflow-hidden border-2 border-wyrd-indigo-900 p-2{% if additional_class %} {{ additional_class }}{% endif %}">
    <div class="flex flex-col items-center {% if size == 'small' %} max-sm:w-card-s-mobile max-sm:h-card-s-mobile {% elif size == 'large' %} w-card-l-desktop max-sm:w-card-l-mobile {% endif %}">
        <div class="relative bg-wyrd-purple-500 w-full rounded-3xl {% if size == 'small' %} max-sm:h-card-s-mobile h-card-s-desktop {% elif size == 'large' %} h-card-l-desktop max-sm:h-card-l-mobile {% endif %} text-white leading-h3 font-bold text-h3 text-center">
            {% if guest.photo %}
                {% image guest.photo fill-400x400 as guest_img %}
                <img src="{{ guest_img.url }}" alt="{{ guest.title }}" class="w-full h-full object-cover">
                <span class="absolute bottom-4 left-0 w-full">{{ guest.title }}</span>
            {% else %}
                <span class="absolute bottom-4 left-0 w-full">?</span>
            {% endif %}
        </div>
        
        <div class="p-4 w-full text-center">
            {% if guest.subtitle %}
                <p class="font-bold text-h5 leading-h5 uppercase text-wyrd-purple-500">
                    {{ guest.subtitle }}
                </p>
            {% endif %}
            {% if guest.description %}
                <div class="text-wyrd-indigo-300 font-bold text-lg leading-5 line-clamp-5">
                    {{ guest.description|safe }}
                </div>
            {% endif %}
        </div>
    </div>
</div>
