<div class="bg-white rounded-lg shadow-sm p-6">
    <h3 class="font-bold text-xl mb-2">{{ monde.title }}</h3>
    {% if monde.description %}
        <div class="text-gray-600 mb-4">{{ monde.description|safe }}</div>
    {% endif %}
    {% if monde.cta_text and monde.cta_link %}
        <a href="{{ monde.cta_link }}" class="inline-block px-4 py-2 bg-gray-900 text-white rounded hover:bg-gray-700 transition-colors text-sm">
            {{ monde.cta_text }}
        </a>
    {% endif %}
</div>
